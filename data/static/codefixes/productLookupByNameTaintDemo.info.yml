fixes:
  - id: 1
    explanation: "Trying to prevent any injection attacks with a custom-built blocklist mechanism is doomed to fail. It might work for some simpler attack payloads but an attacker with time and skills can likely bypass it at some point."
  - id: 2
    explanation: 'Using the built-in replacement (or binding) mechanism of Sequelize is equivalent to creating a Prepared Statement. This prevents tampering with the query syntax through malicious user input as it is "set in stone" before the name parameter is inserted.'
  - id: 3
    explanation: "Limiting the allowed name values via startsWith() would still allow SQL Injection via a specially crafted prefix, e.g. \"apple' OR '1'='1\" or similarly prefixed payloads. This fix also unnecessarily restricts the legitimate use of the exact-match lookup."
hints:
  - "Try to identify any variables in the code that might contain arbitrary user input."
  - "Follow the user input through the function call and try to spot places where it might be abused for malicious purposes."
  - "Can you spot a place where a SQL query is being cobbled together in an unsafe way?"
